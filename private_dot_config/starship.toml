format = """
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#545c7e)\
$time\
[ ](fg:#545c7e)\
$character"""

[username]
style_user = 'bg:#b4f9f8'
format = '[ $user ](fg:#1f2335 bg:#b4f9f8)'
show_always = true

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#545c7e"
format = '[[ $time ](fg:#b4f9f8 bg:#545c7e)]($style)'
