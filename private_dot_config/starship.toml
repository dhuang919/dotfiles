format = """
$username\
[](fg:#1c3144 bg:#596f62)\
$directory\
[](fg:#596f62 bg:#7ea16b)\
$git_branch\
$git_status\
[ ](fg:#7ea16b bg:#c3d898)\
$time\
[ ](fg:#c3d898)\
$character"""

[username]
style_root = "fg:red bg:#1c3144"
style_user = "fg:#ffffff bg:#1c3144"
format = "[ $user ]($style)"
disabled = false
show_always = true

[directory]
style = "fg:#ffffff bg:#596f62"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
symbol = ""
style = "fg:#ffffff bg:#7ea16b"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:#ffffff bg:#7ea16b"
modified = "*"
format = '[($all_status$ahead_behind )]($style)'

[time]
disabled = false
time_format = "%T"
style = "fg:#000000 bg:#c3d898"
format = '[ $time ]($style)'

[character]
success_symbol = '[\$](bold green)'
error_symbol = '[\$](bold red)'
