prSections:
  - title: My Open PRs
    filters: >-
      is:open
      author:@me
    layout:
      author:
        hidden: true
  - title: My Assigned
    filters: >-
      assignee:@me
    layout:
      author:
        hidden: true
  - title: My Closed PRs (6mo)
    filters: >-
      is:closed
      author:@me
      updated:>={{ nowModify "-6mo" }}
    layout:
      author:
        hidden: true
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
  - title: Runtime platform
    filters: >-
      is:open
      is:pr
      archived:false
      org:bbenv
      org:systems-core-environment
      org:prqsex
      org:systems-libraries
      org:systems
      org:systems-utils
      org:svcm
      org:bbfilexfer
      org:rtcpu
      org:bbrc
      org:cores
      org:svcm
  - title: Peter
    filters: >-
      is:open
      -is:draft
      author:pmartini
  - title: Vinit
    filters: >-
      is:open
      -is:draft
      author:vshah178
  - title: Steven
    filters: >-
      is:open
      -is:draft
      author:spackard
  - title: Jim
    filters: >-
      is:open
      -is:draft
      author:jmahood
  - title: Yudhi
    filters: >-
      is:open
      -is:draft
      author:ydeshpande1
  - title: Nhuja
    filters: >-
      is:open
      -is:draft
      author:nmaharjan2
  - title: Eric
    filters: >-
      is:open
      -is:draft
      author:eadamson7
issuesSections:
  - title: My Issues
    filters: >-
      is:open
      author:@me
  - title: Assigned
    filters: >-
      is:open
      assignee:@me
  - title: Involved
    filters: >-
      is:open
      involves:@me
      -author:@me
repo:
  branchesRefetchIntervalSeconds: 60
  prsRefetchIntervalSeconds: 120
defaults:
  preview:
    open: true
    width: 50
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
      author:
        width: 15
      authorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  universal: []
  issues: []
  prs: []
  branches: []
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: false
pager:
  diff: delta
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
