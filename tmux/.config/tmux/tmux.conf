# Minimal tmux config (migrated from oh-my-tmux)
# ================================================

# -- General settings ----------------------------------------------------------

set -g history-limit 20000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg repeat-time 300
set -sg escape-time 10
set -g focus-events on
set -g display-time 250

# Vi mode
set -g mode-keys vi
set -g status-keys emacs

# Terminal/color settings
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[6 q'  # cursor: 6 = steady bar, 2 = steady block
set -g allow-passthrough on

# Disable activity monitoring
setw -g monitor-activity off
set -g visual-activity off

# -- Prefix key ----------------------------------------------------------------

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -- Key bindings --------------------------------------------------------------

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Rename window
bind R command-prompt -I "#W" "rename-window '%%'"
bind . run-shell "tmux rename-window $(basename #{pane_current_path})"

# Pane splitting (matching wezterm)
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind , split-window -h -l 28% -c "#{pane_current_path}"

# New window retains current path
bind c new-window -c "#{pane_current_path}"

# Window navigation (Alt + [/])
bind -n M-[ previous-window
bind -n M-] next-window

# Window reordering (Leader + </>)
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# Pane navigation (Ctrl+hjkl) - handled by vim-tmux-navigator plugin
# Fallback if plugin not loaded:
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Pane resizing (Leader + HJKL)
bind -r H resize-pane -L 15
bind -r J resize-pane -D 15
bind -r K resize-pane -U 15
bind -r L resize-pane -R 15

# Layout
bind = select-layout tiled

# Clear screen and history
# bind -n C-g send-keys -R \; send-keys Enter \; clear-history

# Close pane (matching wezterm)
bind x kill-pane

# Zoom pane
bind z resize-pane -Z

# Copy mode (Leader + [)
bind [ copy-mode

# -- Copy mode (vi-style) ------------------------------------------------------

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Copy to system clipboard on macOS
if-shell "uname | grep -q Darwin" {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
}

# -- Status bar (matching starship theme) --------------------------------------

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#5d5d5d,fg=#ffffff"

# Status left: session name + prefix indicator
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=#ffffff]#[fg=#000000]#[bold] ⌨ ,#[bg=#222f5b]#[fg=#ffffff]#[bold] #S }#[fg=#222f5b,bg=#5d5d5d] "

# Status right: time and date
set -g status-right-length 60
set -g status-right "#[fg=#222f5b,bg=#5d5d5d]#[bg=#222f5b,fg=#ffffff] %H:%M | %d %b "

# Window status
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#5d5d5d,bg=#946b2d]#[bg=#946b2d,fg=#ffffff,bold] #I #W#{?window_zoomed_flag, Z,} #[fg=#946b2d,bg=#5d5d5d]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#5d5d5d"
set -g pane-active-border-style "fg=#946b2d"

# Message style
set -g message-style "bg=#946b2d,fg=#ffffff,bold"

# -- TPM (Tmux Plugin Manager) -------------------------------------------------

# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-fzf-url'

# Plugin settings
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
