# Minimal tmux config (migrated from oh-my-tmux)
# ================================================

# -- General settings ----------------------------------------------------------

set -g history-limit 20000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg repeat-time 300
set -sg escape-time 10
set -g focus-events on
set -g display-time 500

# Vi mode
set -g mode-keys vi
set -g status-keys emacs

# Terminal/color settings
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'  # cursor: 2 = steady block, 6 = steady bar
set -g set-clipboard on
set -g allow-passthrough on

# Disable activity monitoring
setw -g monitor-activity off
set -g visual-activity off

# -- Prefix key ----------------------------------------------------------------

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -- Key bindings --------------------------------------------------------------

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Session management
bind N command-prompt -p "New session:" "new-session -s '%%'"
bind X confirm-before -p "Kill session #S? (y/n)" "kill-session"
bind Tab switch-client -l

# Rename window
bind R command-prompt -I "#W" "rename-window '%%'"
bind . run-shell "tmux rename-window $(basename #{pane_current_path})"

# Pane splitting (matching wezterm)
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind , split-window -h -l 28% -c "#{pane_current_path}"

# New window retains current path
bind c new-window -c "#{pane_current_path}"

# Window navigation (Alt + [/])
bind -n M-[ previous-window
bind -n M-] next-window

# Window reordering (Leader + </>)
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# Pane navigation - pass through for nvim or when passthrough mode is enabled
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?nvim$'"
should_passthrough='[ "$(tmux show -pv @passthrough)" -eq 1 ] 2>/dev/null'
bind -n C-h if-shell "$is_vim || $should_passthrough" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim || $should_passthrough" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim || $should_passthrough" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim || $should_passthrough" "send-keys C-l" "select-pane -R"

# Toggle passthrough mode for current pane (Leader + \)
bind \\ run-shell 'tmux set -p @passthrough $([ "$(tmux show -pv @passthrough)" -eq 1 ] 2>/dev/null && echo 0 || echo 1)'

# Pane resizing (Leader + HJKL)
bind -r H resize-pane -L 15
bind -r J resize-pane -D 15
bind -r K resize-pane -U 15
bind -r L resize-pane -R 15

# Layout
bind = select-layout tiled

# Close pane (matching wezterm)
bind x kill-pane

# Zoom pane
bind z resize-pane -Z

# Toggle synchronize-panes
bind S setw synchronize-panes

# Copy mode (Leader + [)
bind [ copy-mode

# Mark pane for fast/easy jumping
bind m select-pane -m
bind M switch-client -t '{marked}'

# -- Copy mode (vi-style) ------------------------------------------------------

# Allow switching panes in copy mode (stays in copy mode)
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Copy to system clipboard on macOS
if-shell "uname | grep -q Darwin" {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
}

# -- Status bar ----------------------------------------------------------------

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#d0d0d0,fg=#333333"

# Status left: session name + prefix indicator
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=#333333]#[fg=#ffffff]#[bold] ⌨ ,#[bg=#4a5a8a]#[fg=#ffffff]#[bold] #S }#[fg=#4a5a8a,bg=#d0d0d0] "

# Status right: time and date
set -g status-right-length 60
set -g status-right "#[fg=#4a5a8a,bg=#d0d0d0]#[bg=#4a5a8a,fg=#ffffff] %H:%M | %d %b "

# Window status
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#d0d0d0,bg=#b8862d]#[bg=#b8862d,fg=#ffffff,bold] #I #W#{?window_zoomed_flag, Z,}#{?pane_synchronized, S,}#{?#{==:#{@passthrough},1}, →,} #[fg=#b8862d,bg=#d0d0d0]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#b0b0b0"
set -g pane-active-border-style "fg=#4a5a8a"

# Dim inactive panes (darker grey for inactive, Catppuccin Latte base for active)
set -g window-style "bg=#c4c9d6"
set -g window-active-style "bg=#eff1f5"

# Message style
set -g message-style "bg=#b8862d,fg=#ffffff,bold"

# -- TPM (Tmux Plugin Manager) -------------------------------------------------

# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'omerxx/tmux-sessionx'

# Plugin settings
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @jump-key 'j'
set -g @sessionx-bind 'o'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
